<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Catalogue (F2.2)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container" style="max-width: 900px; margin: 30px auto; padding: 20px;">
    <h2>F2.2: Full Book Catalogue</h2>
    <p><a href="{{ url_for('library') }}">Back to Library</a> | <a href="{{ url_for('search_books') }}">Search Books</a></p>

    <table border="1" cellpadding="8" cellspacing="0" style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr style="background: #007bff; color: white;">
                <th>ID</th><th>Title</th><th>Author</th><th>Publisher</th><th>Category</th><th>Year</th><th>Price ($)</th>
            </tr>
        </thead>
        <tbody>
            {% for b in books %}
            <tr>
                <td>{{ b.book_id }}</td>
                <td>{{ b.title }}</td>
                <td>{{ b.author_name }}</td>
                <td>{{ b.publisher_name }}</td>
                <td>{{ b.category_name }}</td>
                <td>{{ b.publish_year }}</td>
                <td>{{ "%.2f"|format(b.price) }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
